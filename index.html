<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini RPG - Pixel Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Menu -->
    <div id="mainMenu" class="menu-overlay">
        <div class="menu-container">
            <h1 class="game-title">⚔️ MINI RPG</h1>
            <div class="menu-buttons">
                <button id="newGameBtn" class="menu-btn">🆕 NEW GAME</button>
                <button id="continueBtn" class="menu-btn" disabled>📂 CONTINUE</button>
                <button id="settingsBtn" class="menu-btn">⚙️ SETTINGS</button>
                <button id="resetDataBtn" class="menu-btn danger">🗑️ RESET DATA</button>
            </div>
            <div class="menu-version">v1.0.0</div>
        </div>
    </div>

    <!-- Character Creation -->
    <div id="characterCreation" class="menu-overlay" style="display:none;">
        <div class="creation-container">
            <h2>TẠO NHÂN VẬT</h2>
            <div class="creation-form">
                <div class="form-group">
                    <label>Tên nhân vật:</label>
                    <input type="text" id="playerName" value="Hero" maxlength="12">
                </div>
                <div class="form-group">
                    <label>Giới tính:</label>
                    <div class="gender-select">
                        <button class="gender-btn active" data-gender="male">🧑 Nam</button>
                        <button class="gender-btn" data-gender="female">👩 Nữ</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Màu tóc:</label>
                    <div class="color-select">
                        <button class="color-btn active" style="background:#8B6914;" data-hair="brown"></button>
                        <button class="color-btn" style="background:#1a1a1a;" data-hair="black"></button>
                        <button class="color-btn" style="background:#FFD700;" data-hair="blonde"></button>
                        <button class="color-btn" style="background:#FF4500;" data-hair="red"></button>
                        <button class="color-btn" style="background:#C0C0C0;" data-hair="white"></button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Trang phục:</label>
                    <div class="outfit-select">
                        <button class="outfit-btn active" data-outfit="adventurer">🗡️ Nhà thám hiểm</button>
                        <button class="outfit-btn" data-outfit="knight">🛡️ Hiệp sĩ</button>
                        <button class="outfit-btn" data-outfit="mage">🔮 Pháp sư</button>
                        <button class="outfit-btn" data-outfit="rogue">🗡️ Sát thủ</button>
                    </div>
                </div>
                <button id="startGameBtn" class="menu-btn primary">BẮT ĐẦU HÀNH TRÌNH 🚀</button>
            </div>
        </div>
    </div>

    <!-- Game Container -->
    <div id="gameContainer" style="display:none;">
        <canvas id="gameCanvas"></canvas>
        
        <!-- HUD -->
        <div id="hud" class="hud">
            <div class="hud-top">
                <div class="hud-left">
                    <div class="player-name" id="hudName">Player</div>
                    <div class="player-level">LV <span id="hudLevel">1</span></div>
                </div>
                <div class="hud-right">
                    <div class="gold-display">🪙 <span id="hudGold">0</span></div>
                </div>
            </div>
            <div class="hud-bars">
                <div class="stat-bar">
                    <span class="stat-label">❤️ HP</span>
                    <div class="bar-bg">
                        <div class="bar-fill hp-bar" id="hpBar" style="width:100%"></div>
                    </div>
                    <span class="stat-text" id="hpText">100/100</span>
                </div>
                <div class="stat-bar">
                    <span class="stat-label">💧 MP</span>
                    <div class="bar-bg">
                        <div class="bar-fill mp-bar" id="mpBar" style="width:100%"></div>
                    </div>
                    <span class="stat-text" id="mpText">50/50</span>
                </div>
                <div class="stat-bar">
                    <span class="stat-label">⭐ EXP</span>
                    <div class="bar-bg">
                        <div class="bar-fill exp-bar" id="expBar" style="width:0%"></div>
                    </div>
                    <span class="stat-text" id="expText">0/100</span>
                </div>
            </div>
        </div>

        <!-- Skill Bar -->
        <div id="skillBar" class="skill-bar">
            <button class="skill-btn" data-skill="0">[1] ⚔️ Tấn công</button>
            <button class="skill-btn" data-skill="1">[2] 🔥 Fireball</button>
            <button class="skill-btn" data-skill="2">[3] ⚡ Lightning</button>
            <button class="skill-btn" data-skill="3">[4] 🛡️ Shield</button>
        </div>

        <!-- Interaction Hint -->
        <div id="interactionHint" class="interaction-hint" style="display:none;">
            Nhấn <kbd>E</kbd> để tương tác
        </div>

        <!-- UI Overlays -->
        <div id="inventoryUI" class="ui-overlay" style="display:none;">
            <div class="ui-container">
                <h2>🎒 TÚI ĐỒ</h2>
                <div class="inventory-grid" id="inventoryGrid"></div>
                <div class="inventory-info" id="inventoryInfo">Chọn một vật phẩm để xem thông tin</div>
                <button class="close-ui-btn" onclick="closeInventory()">Đóng [I]</button>
            </div>
        </div>

        <div id="shopUI" class="ui-overlay" style="display:none;">
            <div class="ui-container">
                <h2>🏪 CỬA HÀNG</h2>
                <div class="shop-tabs">
                    <button class="shop-tab active" data-tab="buy">🛒 Mua</button>
                    <button class="shop-tab" data-tab="sell">💰 Bán</button>
                </div>
                <div class="shop-items" id="shopItems"></div>
                <div class="shop-info">🪙 <span id="shopGold">0</span></div>
                <button class="close-ui-btn" onclick="closeShop()">Đóng</button>
            </div>
        </div>

        <div id="questUI" class="ui-overlay" style="display:none;">
            <div class="ui-container">
                <h2>📜 NHIỆM VỤ</h2>
                <div id="questList"></div>
                <button class="close-ui-btn" onclick="closeQuest()">Đóng</button>
            </div>
        </div>

        <div id="dialogueUI" class="ui-overlay" style="display:none;">
            <div class="dialogue-container">
                <div class="dialogue-portrait" id="dialoguePortrait">🧙</div>
                <div class="dialogue-text" id="dialogueText">Hello!</div>
                <div class="dialogue-options" id="dialogueOptions"></div>
                <button class="close-ui-btn" onclick="closeDialogue()">Đóng</button>
            </div>
        </div>

        <!-- Pause Menu -->
        <div id="pauseMenu" class="menu-overlay" style="display:none;">
            <div class="menu-container">
                <h2>⏸️ TẠM DỪNG</h2>
                <div class="menu-buttons">
                    <button class="menu-btn" onclick="resumeGame()">▶️ Tiếp tục</button>
                    <button class="menu-btn" onclick="saveGame()">💾 Lưu game</button>
                    <button class="menu-btn" onclick="showSettings()">⚙️ Cài đặt</button>
                    <button class="menu-btn danger" onclick="quitToMenu()">🚪 Thoát</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification" style="display:none;"></div>

    <script src="js/game.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/map.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/skills.js"></script>
    <script src="js/save.js"></script>
    <script src="js/leaderboard.js"></script>
    <!-- Thêm vào cuối body, sau các script khác -->
    <script src="js/shop.js"></script>
    <script src="js/skills.js"></script>
    <script src="js/save.js"></script>
    <script src="js/leaderboard.js"></script>
</body>
</html>

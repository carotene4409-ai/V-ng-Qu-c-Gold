<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server 3 - Bạn Vẽ AI Đoán</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .game-box { background: #222; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 15px; border: 2px solid cyan; }
        h1 { color: #00d2d3; }
        canvas { background: white; border: 2px solid #333; cursor: crosshair; margin: 10px 0; border-radius: 10px; }
        .tools { margin: 10px 0; }
        .tools button { padding: 8px 15px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; background: #555; color: white; }
        #guessBtn { background: #00b894; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px;}
        .btn-back { margin-top: 20px; display: inline-block; padding: 10px 20px; background: #555; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="game-box">
        <h1>🎨 MÁY CHỦ 3: VẼ TRANH</h1>
        <p>Vẽ thứ gì đó, bấm "Đoán Xem" để xem AI nghĩ gì.</p>
        <canvas id="drawCanvas" width="400" height="300"></canvas>
        
        <div class="tools">
            <button onclick="setColor('black')">Màu Đen</button>
            <button onclick="setColor('red')">Màu Đỏ</button>
            <button onclick="setColor('blue')">Màu Xanh</button>
            <button onclick="clearCanvas()">🗑️ Xóa</button>
        </div>
        <button id="guessBtn" onclick="guessDrawing()">🤖 ĐOÁN XEM LÀ GÌ?</button>
        
        <div id="aiGuess" style="margin: 15px 0; font-size: 24px; font-weight: bold; color: #f1c40f;">Chờ bạn vẽ...</div>

        <a href="index.html" class="btn-back">⬅ Về Cổng Game</a>
    </div>

    <script>
        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDYXPAXWGWNoP1f6R23Vjgn4bqghst7bhs",
            databaseURL: "https://lang-la-tqb-default-rtdb.firebaseio.com",
            projectId: "lang-la-tqb",
            appId: "1:32586764344:web:fe15cfb7ee8a1df98d16cd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        // Canvas Drawing Logic
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;
        let color = 'black';

        canvas.addEventListener('mousedown', (e) => { drawing = true; draw(e); });
        canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', draw);

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = color;
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function setColor(c) { color = c; }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        // Đoán (Giả lập)
        const guessWords = ["Cái Cây", "Cái Nhà", "Con Mèo", "Mặt Trời", "Con Cá", "Cái Bánh", "Chiếc Xe", "Bông Hoa"];
        function guessDrawing() {
            let guess = guessWords[Math.floor(Math.random() * guessWords.length)];
            document.getElementById("aiGuess").innerText = "🤖 AI nghĩ bạn đang vẽ: " + guess;
        }
    </script>
</body>
</html>

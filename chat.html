<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Chat Realtime - LÀNG LÁ TQB</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 20px 15px; color: white;
            background: #000 url('https://rehire-idealism-unseeing.ngrok-free.dev/vuongquocgold/magrdinhmenh.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .container { width: 100%; max-width: 500px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        .nav-buttons { display: flex; gap: 8px; }
        .nav-btn {
            text-decoration: none; color: white; padding: 8px 12px; border-radius: 10px;
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px); transition: 0.3s; font-size: 13px; font-weight: bold;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.3); }

        .card {
            background: rgba(20, 20, 30, 0.85); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #ccc; font-size: 16px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: #ff9900; border-bottom: 2px solid #ff9900; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #252631; color: white; font-size: 15px; outline: none; }

        .btn-submit { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #ff9900; color: white; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }

        .chat-box { display: none; }
        .user-info { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 10px; margin-bottom: 15px; }
        .logout-btn { background: #ff4444; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }

        .messages-list { height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 5px; margin-bottom: 15px; }
        
        .chat-msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,0.15); align-self: flex-start; }
        .chat-msg.me { background: #0084ff; align-self: flex-end; }
        .chat-msg .author { font-size: 12px; font-weight: bold; color: #ffcc00; margin-bottom: 3px; }
        .chat-msg.me .author { color: #cce5ff; text-align: right; }
        .chat-msg .text { font-size: 14px; word-break: break-word; }
        .chat-msg .time { font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 4px; text-align: right; }

        .chat-input-row { display: flex; gap: 10px; }
        .chat-input-row input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #252631; color: white; outline: none; }
        .chat-input-row button { padding: 0 20px; border-radius: 10px; border: none; background: #00ffae; color: #111; font-weight: bold; cursor: pointer; }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>💬 PHÒNG CHAT</h2>
            <div class="nav-buttons">
                <a href="index.html" class="nav-btn">🏠 Trang Chủ</a>
                <a href="game.html" class="nav-btn" style="background: rgba(0, 255, 174, 0.4);">Ai Là Vua</a>
                <a href="nap.html" class="nav-btn" style="background: rgba(255, 204, 0, 0.3);">💳 Nạp Tiền</a>
            </div>
        </div>

        <div class="card">
            <!-- FORM ĐĂNG NHẬP / ĐĂNG KÝ -->
            <div class="auth-box" id="authBox">
                <div class="auth-tabs">
                    <button class="tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">Đăng Nhập</button>
                    <button class="tab-btn" id="tabRegisterBtn" onclick="switchTab('register')">Đăng Ký</button>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Tên tài khoản</label>
                        <input type="text" id="loginUser" required placeholder="Nhập tài khoản...">
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" id="loginPass" required placeholder="Nhập mật khẩu...">
                    </div>
                    <button class="btn-submit" type="submit">ĐĂNG NHẬP CHAT</button>
                </form>

                <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
                    <div class="form-group">
                        <label>Tên tài khoản mới</label>
                        <input type="text" id="regUser" required placeholder="Tên tài khoản...">
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" id="regPass" required placeholder="Tạo mật khẩu...">
                    </div>
                    <button class="btn-submit" type="submit" style="background: #00ffae; color: #000;">TẠO TÀI KHOẢN</button>
                </form>
            </div>

            <!-- KHU VỰC CHAT -->
            <div class="chat-box" id="chatBox">
                <div class="user-info">
                    <div>
                        <span>Xin chào: <b id="currentUserDisplay" style="color:#00ffae;">-</b></span>
                        <br>
                        <span style="font-size: 13px;">💰 Gold: <b id="userGoldDisplay" style="color:#ffcc00;">0</b></span>
                    </div>
                    <button class="logout-btn" onclick="handleLogout()">Đăng xuất</button>
                </div>

                <div class="messages-list" id="messagesList"></div>

                <div class="chat-input-row">
                    <input type="text" id="msgInput" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') sendMsg()">
                    <button onclick="sendMsg()">GỬI</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDYXPAXWGWNoP1f6R23Vjgn4bqghst7bhs",
            authDomain: "lang-la-tqb.firebaseapp.com",
            databaseURL: "https://lang-la-tqb-default-rtdb.firebaseio.com",
            projectId: "lang-la-tqb",
            storageBucket: "lang-la-tqb.firebasestorage.app",
            messagingSenderId: "32586764344",
            appId: "1:32586764344:web:fe15cfb7ee8a1df98d16cd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = localStorage.getItem("currentUser") || null;

        function switchTab(type) {
            if (type === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('tabLoginBtn').classList.add('active');
                document.getElementById('tabRegisterBtn').classList.remove('active');
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('tabRegisterBtn').classList.add('active');
                document.getElementById('tabLoginBtn').classList.remove('active');
            }
        }

        // ĐĂNG KÝ TÀI KHOẢN LÊN FIREBASE
        function handleRegister(e) {
            e.preventDefault();
            let u = document.getElementById('regUser').value.trim();
            let p = document.getElementById('regPass').value.trim();

            if (!u || !p) return;

            // Kiểm tra xem username đã tồn tại trên Firebase chưa
            db.ref('users/' + u).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    alert("⚠️ Tài khoản này đã tồn tại!");
                    return;
                }

                // Lưu tài khoản mới lên Firebase (Mặc định Gold = 0)
                db.ref('users/' + u).set({
                    password: p,
                    gold: 0
                }).then(() => {
                    currentUser = u;
                    localStorage.setItem("currentUser", currentUser);
                    alert(`✅ Đăng ký thành công tài khoản [ ${currentUser} ]!`);
                    checkAuth();
                }).catch(err => {
                    alert("❌ Lỗi đăng ký: " + err.message);
                });
            });
        }

        // ĐĂNG NHẬP QUA FIREBASE
        function handleLogin(e) {
            e.preventDefault();
            let u = document.getElementById('loginUser').value.trim();
            let p = document.getElementById('loginPass').value.trim();

            db.ref('users/' + u).once('value').then(snapshot => {
                if (!snapshot.exists()) {
                    alert("❌ Tài khoản này chưa tồn tại!");
                    return;
                }

                let userData = snapshot.val();
                if (userData.password !== p) {
                    alert("❌ Sai mật khẩu! Vui lòng kiểm tra lại.");
                    return;
                }

                currentUser = u;
                localStorage.setItem("currentUser", currentUser);
                checkAuth();
            });
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem("currentUser");
            checkAuth();
        }

        function checkAuth() {
            currentUser = localStorage.getItem("currentUser") || null;
            if (currentUser) {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('chatBox').style.display = 'block';
                document.getElementById('currentUserDisplay').innerText = currentUser;
                
                // Lắng nghe cập nhật Gold và Tin nhắn thời gian thực
                listenForGold();
                listenForMessages();
            } else {
                document.getElementById('authBox').style.display = 'block';
                document.getElementById('chatBox').style.display = 'none';
            }
        }

        // LẮNG NGHE SỐ GOLD THỜI GIAN THỰC TỪ FIREBASE
        function listenForGold() {
            if (!currentUser) return;
            db.ref('users/' + currentUser + '/gold').on('value', snapshot => {
                let gold = snapshot.val() || 0;
                document.getElementById('userGoldDisplay').innerText = gold.toLocaleString('vi-VN');
            });
        }

        function sendMsg() {
            let input = document.getElementById('msgInput');
            let text = input.value.trim();
            if (!text || !currentUser) return;

            let now = new Date();
            let timeStr = (now.getHours() < 10 ? '0' : '') + now.getHours() + ":" + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();

            let newMsgRef = db.ref('messages').push();
            newMsgRef.set({
                user: currentUser,
                text: text,
                time: timeStr
            });

            input.value = "";
        }

        function listenForMessages() {
            db.ref('messages').limitToLast(50).on('value', snapshot => {
                let list = document.getElementById('messagesList');
                list.innerHTML = "";

                let data = snapshot.val();
                if (!data) {
                    list.innerHTML = `<div style="text-align:center; color:#aaa; font-size:13px; margin-top:20px;">Chưa có tin nhắn nào.</div>`;
                    return;
                }

                Object.keys(data).forEach(key => {
                    let msg = data[key];
                    let isMe = msg.user === currentUser;
                    let msgDiv = document.createElement('div');
                    msgDiv.className = `chat-msg ${isMe ? 'me' : ''}`;
                    
                    let safeText = msg.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");

                    msgDiv.innerHTML = `
                        <div class="author">${msg.user}</div>
                        <div class="text">${safeText}</div>
                        <div class="time">${msg.time}</div>
                    `;
                    list.appendChild(msgDiv);
                });

                setTimeout(() => {
                    list.scrollTop = list.scrollHeight;
                }, 100);
            });
        }

        checkAuth();
            // Đoạn này đặt ở đầu trang web, sau khi cấu hình Firebase
const database = firebase.database();
let currentUserName = localStorage.getItem("currentUser"); // Lấy tên tài khoản đang login

if (currentUserName) {
    // QUAN TRỌNG: Dùng on('value') thay vì once('value')
    database.ref('users/' + currentUserName + '/gold').on('value', (snapshot) => {
        let gold = snapshot.val() || 0;
        
        // Cập nhật UI (Giao diện) tại đây
        // Ví dụ: cập nhật vào thẻ HTML có id là "displayGold"
        document.getElementById("displayGold").innerText = gold.toLocaleString('vi-VN');
        
        // Hoặc nếu bạn dùng biến toàn cục:
        // window.currentGold = gold; 
    });
}
    </script>

</body>

</html>

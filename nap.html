<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VƯƠNG QUỐC GOLD - NẠP TIỀN</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: #0b0c10 url('https://rehire-idealism-unseeing.ngrok-free.dev/vuongquocgold/magrdinhmenh.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .top-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            width: 75px;
            height: 65px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }
        .nav-btn.active { background: rgba(255, 204, 0, 0.25); border-color: #ffcc00; color: #ffcc00; }
        .nav-btn[href="admin.html"]:hover { background: rgba(255, 71, 87, 0.3) !important; }

        /* Khung Hiển Thị Số Dư & Đăng Nhập */
        .balance-box {
            width: 100%;
            max-width: 480px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 204, 0, 0.5);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .balance-title { font-size: 13px; font-weight: bold; color: #aaa; }
        .balance-value { font-size: 18px; font-weight: 900; color: #ffcc00; text-shadow: 0 0 8px rgba(255, 204, 0, 0.6); }

        .nap-card {
            width: 100%;
            max-width: 480px;
            background: rgba(13, 14, 22, 0.92);
            border: 2px solid rgba(255, 204, 0, 0.4);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.85);
            text-align: center;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255,204,0,0.5);
            text-transform: uppercase;
        }

        .qr-box {
            background: #ffffff;
            padding: 10px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
        }

        .qr-box img {
            width: 200px;
            height: 200px;
            display: block;
            border-radius: 8px;
        }

        .bank-info {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: left;
            font-size: 13px;
            line-height: 1.8;
        }

        .bank-info span { color: #ffcc00; font-weight: bold; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .input-field:focus { border-color: #ffcc00; }

        .btn-zalo {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0068ff, #00a2ff);
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(0, 104, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-zalo:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <!-- Menu Điều Hướng -->
    <div class="top-header">
        <a href="index.html" class="nav-btn">
            <span>🏠</span>
            <span>Trang chủ</span>
        </a>
        <a href="chat.html" class="nav-btn">
            <span>💬</span>
            <span>Phòng Chat</span>
        </a>
        <a href="game.html" class="nav-btn">
            <span>👑</span>
            <span>Ai Là Vua?</span>
        </a>
        <a href="nap.html" class="nav-btn active">
            <span>💳</span>
            <span>Nạp Tiền</span>
        </a>
        <a href="admin.html" class="nav-btn" style="border-color: #ff4757; color: #ff4757;">
            <span>🔐</span>
            <span>Admin</span>
        </a>
    </div>

    <!-- KHUNG TÀI KHOẢN & SỐ DƯ (ĐĂNG NHẬP / ĐĂNG KÝ CÓ MẬT KHẨU) -->
    <div class="balance-box">
        <!-- Khi CHƯA ĐĂNG NHẬP -->
        <div id="authBox" style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
            <div style="font-weight: bold; color: #ffcc00; font-size: 14px;">🔐 ĐĂNG NHẬP / ĐĂNG KÝ TÀI KHOẢN</div>
            <input type="text" id="loginUser" class="input-field" placeholder="Nhập Tên tài khoản / ID game..." style="padding: 8px;">
            <input type="password" id="loginPass" class="input-field" placeholder="Nhập Mật khẩu..." style="padding: 8px;">
            <div style="display: flex; gap: 8px;">
                <button onclick="userLogin()" class="btn-zalo" style="background: #00b894; padding: 8px;">Đăng Nhập</button>
                <button onclick="userRegister()" class="btn-zalo" style="background: #e17055; padding: 8px;">Đăng Ký Mới</button>
            </div>
        </div>

        <!-- Khi ĐÃ ĐĂNG NHẬP (Mặc định ẩn) -->
        <div id="userInfoBox" style="width: 100%; display: none; justify-content: space-between; align-items: center;">
            <div>
                <div style="font-size: 12px; color: #aaa;">Tài khoản: <b id="displayUsername" style="color: #00b894;">-</b></div>
                <div class="balance-title">💰 SỐ DƯ: <span class="balance-value"><span id="userGold">0</span> GOLD</span></div>
            </div>
            <button onclick="userLogout()" style="background: #d63031; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">Đăng xuất</button>
        </div>
    </div>

    <!-- Khung Nạp Tiền -->
    <div class="nap-card">
        <div class="title">🏆 VƯƠNG QUỐC GOLD - NẠP TIỀN</div>

        <div class="qr-box">
            <img id="qrMbBank" src="" alt="Mã QR MB Bank Vương Quốc Gold">
        </div>

        <div class="bank-info">
            <div>🏦 Ngân hàng: <span>MB BANK</span></div>
            <div>🔢 Số tài khoản: <span>0393102703</span></div>
            <div>👤 Chủ tài khoản: <span>TRAN QUOC BAO</span></div>
            <div>📝 Cú pháp CK: <span>[Tên Game] + VQGOLD</span></div>
        </div>

        <div class="form-group">
            <input type="text" id="username" class="input-field" placeholder="Nhập Tên Game / ID của bạn...">
            <input type="number" id="amount" class="input-field" placeholder="Nhập số tiền đã nạp (VD: 50000)...">
            <button class="btn-zalo" onclick="guiBaoZalo()">
                <span>💬</span> BÁO ADMIN QUA ZALO CỘNG GOLD
            </button>
        </div>
    </div>

<script>
    const STK_MB = "0393102703";
    const TEN_CHU_TK = "TRAN QUOC BAO";
    const SDT_ZALO_ADMIN = "0393102703";

    // Lấy QR MB Bank tự động
    const qrElem = document.getElementById("qrMbBank");
    if (qrElem) {
        qrElem.src = `https://img.vietqr.io/image/MB-${STK_MB}-compact2.png?accountName=${encodeURIComponent(TEN_CHU_TK)}&addInfo=VQGOLD%20NAP%20TIEN`;
    }

    let currentUser = localStorage.getItem("currentUser") || "";

    // Lấy danh sách tài khoản theo chuẩn app_users
    function getUsers() {
        return JSON.parse(localStorage.getItem("app_users") || "{}");
    }

    // Lưu danh sách tài khoản vào app_users
    function saveUsers(users) {
        localStorage.setItem("app_users", JSON.stringify(users));
    }

    // Tự động đồng bộ dữ liệu kiểu cũ (gold_username & pass_username) sang app_users
    function migrateOldData() {
        let users = getUsers();
        let hasChanges = false;

        // Duyệt qua tất cả key trong localStorage
        for (let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if (key && key.startsWith("gold_")) {
                let user = key.replace("gold_", "");
                let oldGold = parseInt(localStorage.getItem(key)) || 0;
                let oldPass = localStorage.getItem("pass_" + user) || "123";

                if (!users[user]) {
                    users[user] = { password: oldPass, gold: oldGold };
                    hasChanges = true;
                } else {
                    // Ưu tiên giữ số Gold lớn hơn nếu có dữ liệu cũ
                    if (oldGold > (users[user].gold || 0)) {
                        users[user].gold = oldGold;
                        hasChanges = true;
                    }
                }
            }
        }

        if (hasChanges) {
            saveUsers(users);
        }
    }

    // Chạy đồng bộ dữ liệu cũ ngay khi tải trang
    migrateOldData();

    // Cập nhật giao diện theo trạng thái đăng nhập
    function checkAuth() {
        let users = getUsers();

        if (currentUser && users[currentUser]) {
            document.getElementById("authBox").style.display = "none";
            document.getElementById("userInfoBox").style.display = "flex";
            document.getElementById("displayUsername").innerText = currentUser;
            
            // Tự động điền Tên game vào ô Báo Zalo
            if (document.getElementById("username")) {
                document.getElementById("username").value = currentUser;
            }

            // Lấy đúng số dư Gold trong app_users
            let gold = users[currentUser].gold || 0;
            document.getElementById("userGold").innerText = gold.toLocaleString('vi-VN');
        } else {
            document.getElementById("authBox").style.display = "flex";
            document.getElementById("userInfoBox").style.display = "none";
        }
    }

    // Hàm Đăng Nhập
    function userLogin() {
        const user = document.getElementById("loginUser").value.trim();
        const pass = document.getElementById("loginPass").value.trim();

        if (!user || !pass) {
            alert("Vui lòng nhập đầy đủ Tên tài khoản và Mật khẩu!");
            return;
        }

        let users = getUsers();

        // Kiểm tra tài khoản đã tồn tại chưa
        if (!users[user]) {
            alert("❌ Tài khoản này chưa tồn tại! Bấm 'Đăng Ký Mới' nhé.");
            return;
        }

        // Kiểm tra Mật khẩu
        if (users[user].password !== pass) {
            alert("❌ Mật khẩu không chính xác! Vui lòng thử lại.");
            return;
        }

        currentUser = user;
        localStorage.setItem("currentUser", currentUser);
        checkAuth();
        alert(`🎉 Đăng nhập thành công! Chào mừng ${currentUser}`);
    }

    // Hàm Đăng Ký
    function userRegister() {
        const user = document.getElementById("loginUser").value.trim();
        const pass = document.getElementById("loginPass").value.trim();

        if (!user || !pass) {
            alert("Vui lòng nhập Tên tài khoản và Mật khẩu muốn tạo!");
            return;
        }

        if (pass.length < 3) {
            alert("Mật khẩu phải có ít nhất 3 ký tự!");
            return;
        }

        let users = getUsers();

        if (users[user]) {
            alert("⚠️ Tên tài khoản này đã có người đăng ký rồi!");
            return;
        }

        // Lưu tài khoản mới vào app_users
        users[user] = {
            password: pass,
            gold: 0
        };
        saveUsers(users);

        currentUser = user;
        localStorage.setItem("currentUser", currentUser);
        checkAuth();
        alert(`✅ Đăng ký thành công tài khoản [ ${currentUser} ]!`);
    }

    // Hàm Đăng Xuất
    function userLogout() {
        currentUser = "";
        localStorage.removeItem("currentUser");
        checkAuth();
    }

    // Báo nạp tiền qua Zalo
    function guiBaoZalo() {
        const user = document.getElementById('username').value.trim();
        const money = document.getElementById('amount').value.trim();

        if (!user || !money) {
            alert('Vui lòng nhập Tên game và Số tiền đã nạp!');
            return;
        }

        const noiDung = `Chào Admin Vương Quốc Gold!\nTài khoản game: ${user}\nĐã chuyển khoản thành công: ${Number(money).toLocaleString('vi-VN')} VNĐ qua MB Bank.\nNhờ Admin kiểm tra cộng Gold giúp mình với!`;
        window.open(`https://zalo.me/${SDT_ZALO_ADMIN}?text=${encodeURIComponent(noiDung)}`, '_blank');
    }

    // Chạy kiểm tra đăng nhập khi vừa vào trang
    checkAuth();
        // Đoạn này đặt ở đầu trang web, sau khi cấu hình Firebase
const database = firebase.database();
let currentUserName = localStorage.getItem("currentUser"); // Lấy tên tài khoản đang login

if (currentUserName) {
    // QUAN TRỌNG: Dùng on('value') thay vì once('value')
    database.ref('users/' + currentUserName + '/gold').on('value', (snapshot) => {
        let gold = snapshot.val() || 0;
        
        // Cập nhật UI (Giao diện) tại đây
        // Ví dụ: cập nhật vào thẻ HTML có id là "displayGold"
        document.getElementById("displayGold").innerText = gold.toLocaleString('vi-VN');
        
        // Hoặc nếu bạn dùng biến toàn cục:
        // window.currentGold = gold; 
    });
}
</script>

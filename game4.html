<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Server 4 - RPG Engine Optimized</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { background: #0b0c10; overflow: hidden; touch-action: none; width: 100vw; height: 100vh; }
        
        #gameWrap { position: relative; width: 100%; height: 100%; background: #2c2c2c; overflow: hidden; }
        #gameCanvas { display: block; width: 100%; height: 100%; background: #2d1b14; image-rendering: pixelated; }

        #hudBox {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: #d35400; border: 3px solid #f39c12; border-radius: 12px;
            padding: 5px 10px; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7); min-width: 140px;
            pointer-events: none;
        }
        #hudAvatar { width: 40px; height: 40px; border-radius: 5px; background: #2d2d44; border: 2px solid #333; }
        #hudAvatar img { width: 100%; height: 100%; object-fit: contain; }
        #hudBars { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .bar-wrap { height: 12px; background: #2c0e0e; border-radius: 4px; position: relative; border: 1px solid #e0a800; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; border-radius: 4px; transition: width 0.1s; }
        .bar-hp .bar-fill { background: #ff2e2e; }
        .bar-kp .bar-fill { background: #2e9aff; }
        .bar-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-size: 9px; font-weight: bold; color: white; text-shadow: 1px 1px 0 #000; }
        
        #lvDisplay {
            position: absolute; top: 90px; left: 15px; z-index: 10;
            background: #8e44ad; padding: 5px 12px; border-radius: 10px;
            border: 2px solid #9b59b6; font-weight: bold; font-size: 14px; color: white;
            pointer-events: none;
        }

        /* ==========================================
           CSS - Analog Stick (Vòng tròn di chuyển)
           ========================================== */
        #joystickZone {
            position: absolute; bottom: 30px; left: 30px; z-index: 10;
            width: 140px; height: 140px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(4px); box-shadow: 0 0 15px rgba(0,0,0,0.5);
            touch-action: none;
            /* Ngăn cản sự kiện cuộn trang khi chạm vào vùng này */
            position: absolute; bottom: 30px; left: 30px; 
        }
        #stickKnob {
            position: absolute;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            pointer-events: none; /* Không bắt sự kiện chuột, để sự kiện từ vùng cha */
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            transition: none; /* Không transition để phản hồi ngay lập tức */
        }
        #joystickZone:active #stickKnob, #joystickZone.active #stickKnob {
            background: rgba(255, 255, 255, 0.4);
            border-color: #ffcc00;
        }

        #btnAttack {
            position: absolute; bottom: 40px; right: 30px; z-index: 10;
            width: 80px; height: 80px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff9f43, #e67e22);
            border: 4px solid #f1c40f; box-shadow: 0 0 20px rgba(255, 165, 0, 0.4);
            display: flex; justify-content: center; align-items: center; font-size: 28px; color: white;
            cursor: pointer; transition: transform 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #btnAttack:active { transform: scale(0.85); background: #d35400; }
        #btnAttack:focus { outline: none; }
        #btnAttack::-moz-focus-inner { border: 0; }

        #charSelectOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); display: flex;
            justify-content: center; align-items: center; flex-direction: column; z-index: 999;
        }
        .select-char-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .char-card {
            background: #1a1a2e; border: 2px solid #444; border-radius: 15px;
            padding: 15px; width: 100px; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .char-card:hover { border-color: #ffcc00; transform: scale(1.05); }
        .char-card img { width: 80px; height: 100px; object-fit: contain; }

        @media (max-width: 600px) {
            #joystickZone { width: 120px; height: 120px; bottom: 20px; left: 20px; }
            #stickKnob { width: 40px; height: 40px; }
            #btnAttack { width: 70px; height: 70px; bottom: 30px; right: 20px; font-size: 22px; }
            #hudBox { padding: 3px 6px; min-width: 100px; }
            #hudAvatar { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>
    <div id="gameWrap">
        <canvas id="gameCanvas"></canvas>

        <div id="charSelectOverlay">
            <h3 style="color: #ffcc00; margin-bottom: 20px; font-size: 22px;">👑 CHỌN ANH HÙNG</h3>
            <div class="select-char-grid">
                <div class="char-card" onclick="selectCharacter('2.png')">
                    <img src="assets/images/characters/2.png" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%22100%22%3E%3Crect fill=%22%23e74c3c%22 width=%2280%22 height=%22100%22/%3E%3Ctext x=%2225%22 y=%2255%22 fill=%22%23fff%22 font-size=%2240%22%3E⚔️%3C/text%3E%3C/svg%3E'">
                    <div style="color:white; font-size:12px;">Chiến Binh</div>
                </div>
                <div class="char-card" onclick="selectCharacter('3.png')">
                    <img src="assets/images/characters/3.png" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%22100%22%3E%3Crect fill=%22%233498db%22 width=%2280%22 height=%22100%22/%3E%3Ctext x=%2225%22 y=%2255%22 fill=%22%23fff%22 font-size=%2240%22%3E🧙%3C/text%3E%3C/svg%3E'">
                    <div style="color:white; font-size:12px;">Pháp Sư</div>
                </div>
                <div class="char-card" onclick="selectCharacter('4.png')">
                    <img src="assets/images/characters/4.png" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%22100%22%3E%3Crect fill=%22%232ecc71%22 width=%2280%22 height=%22100%22/%3E%3Ctext x=%2225%22 y=%2255%22 fill=%22%23fff%22 font-size=%2240%22%3E🗡️%3C/text%3E%3C/svg%3E'">
                    <div style="color:white; font-size:12px;">Sát Thủ</div>
                </div>
            </div>
        </div>

        <div id="hudBox">
            <div id="hudAvatar"><img id="avatarImg" src=""></div>
            <div id="hudBars">
                <div class="bar-wrap bar-hp"><div class="bar-fill" id="hpBar" style="width: 100%"></div><div class="bar-text"><span id="hpText">100/100</span></div></div>
                <div class="bar-wrap bar-kp"><div class="bar-fill" id="kpBar" style="width: 100%"></div><div class="bar-text"><span id="kpText">100/100</span></div></div>
            </div>
        </div>
        <div id="lvDisplay">🎖️ LV: <span id="lvText">1</span> (EXP: <span id="expText">0</span>)</div>

        <!-- Analog Stick -->
        <div id="joystickZone" onmousedown="startStick(event)" onmousemove="moveStick(event)" onmouseup="stopStick()" onmouseleave="stopStick()" ontouchstart="startStick(event)" ontouchmove="moveStick(event)" ontouchend="stopStick()" ontouchcancel="stopStick()">
            <div id="stickKnob"></div>
        </div>
        
        <div id="btnAttack" onmousedown="playerAttack()" ontouchstart="playerAttack()">👊</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDYXPAXWGWNoP1f6R23Vjgn4bqghst7bhs",
            databaseURL: "https://lang-la-tqb-default-rtdb.firebaseio.com",
            projectId: "lang-la-tqb",
            appId: "1:32586764344:web:fe15cfb7ee8a1df98d16cd"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let currentUser = localStorage.getItem("currentUser");
        let users = JSON.parse(localStorage.getItem("app_users") || "{}");
        if (!currentUser || !users[currentUser]) {
            alert("Vui lòng đăng nhập!");
            window.location.href = "index.html";
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const TILE_SIZE = 32;
        const MAP_COLS = 80;
        const MAP_ROWS = 80;
        const WORLD_WIDTH = MAP_COLS * TILE_SIZE;
        const WORLD_HEIGHT = MAP_ROWS * TILE_SIZE;
        let camera = { x: 0, y: 0 };
        let isGameActive = false;
        let isCharacterSelected = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let tileMap = [];
        function generateWorld() {
            for (let r = 0; r < MAP_ROWS; r++) {
                tileMap[r] = [];
                for (let c = 0; c < MAP_COLS; c++) {
                    let randomVal = Math.random();
                    if (randomVal < 0.03) { tileMap[r][c] = 2; } 
                    else if (randomVal < 0.08) { tileMap[r][c] = 1; } 
                    else { tileMap[r][c] = 0; }
                }
            }
            for (let r = 35; r < 45; r++) {
                for (let c = 35; c < 45; c++) {
                    tileMap[r][c] = 0;
                }
            }
        }
        generateWorld();

        function renderWorld() {
            let startCol = Math.floor(camera.x / TILE_SIZE);
            let endCol = startCol + Math.ceil(canvas.width / TILE_SIZE) + 2;
            let startRow = Math.floor(camera.y / TILE_SIZE);
            let endRow = startRow + Math.ceil(canvas.height / TILE_SIZE) + 2;

            startCol = Math.max(0, startCol);
            endCol = Math.min(MAP_COLS, endCol);
            startRow = Math.max(0, startRow);
            endRow = Math.min(MAP_ROWS, endRow);

            for (let row = startRow; row < endRow; row++) {
                for (let col = startCol; col < endCol; col++) {
                    let tileType = tileMap[row][col];
                    let x = col * TILE_SIZE - camera.x;
                    let y = row * TILE_SIZE - camera.y;

                    if (tileType === 0) ctx.fillStyle = '#4caf50';
                    else if (tileType === 1) ctx.fillStyle = '#d4a373';
                    else if (tileType === 2) ctx.fillStyle = '#546e7a';
                    else ctx.fillStyle = '#000';

                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                }
            }
        }

        function checkCollision(nextX, nextY, entityWidth, entityHeight) {
            if (nextX < 0 || nextX > WORLD_WIDTH - entityWidth) return true;
            if (nextY < 0 || nextY > WORLD_HEIGHT - entityHeight) return true;

            let centerX = nextX + entityWidth / 2;
            let centerY = nextY + entityHeight / 2;
            let col = Math.floor(centerX / TILE_SIZE);
            let row = Math.floor(centerY / TILE_SIZE);

            if (col < 0 || col >= MAP_COLS || row < 0 || row >= MAP_ROWS) return true;
            return tileMap[row][col] === 2;
        }

        const player = {
            x: 40 * TILE_SIZE, y: 40 * TILE_SIZE,
            width: 64, height: 80, speed: 4,
            hp: 100, maxHp: 100, kp: 100, maxKp: 100,
            exp: 0, level: 1, kills: 0, facing: 1
        };

        function loadPlayerData() {
            db.ref('rpg_data/' + currentUser).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    let savedData = snapshot.val();
                    player.level = savedData.level || 1;
                    player.maxHp = 100 + (player.level - 1) * 100;
                    player.maxKp = 100 + (player.level - 1) * 100;
                    player.hp = player.maxHp;
                    player.kp = player.maxKp;
                    player.exp = savedData.exp || 0;
                    player.kills = savedData.kills || 0;
                } else {
                    savePlayerData();
                }
                updateHUD();
            });
        }

        function savePlayerData() {
            db.ref('rpg_data/' + currentUser).set({
                level: player.level, exp: player.exp, kills: player.kills
            });
        }
        loadPlayerData();

        const ANIM_BASE_PATH = "assets/images/characters/player/";
        let currentAnimation = 'idle';
        let animationFrameCounter = 0;
        let currentFrameIndex = 0;

        const ANIMATION_CONFIG = {
            'idle':   { totalFrames: 3, frameDelay: 15, nextState: 'idle' },
            'run':    { totalFrames: 6, frameDelay: 8,  nextState: 'run' },
            'attack': { totalFrames: 3, frameDelay: 6,  nextState: 'idle' },
            'die':    { totalFrames: 3, frameDelay: 10, nextState: 'die' }
        };

        function setAnimation(animName) {
            if (currentAnimation !== animName) {
                currentAnimation = animName;
                currentFrameIndex = 0;
                animationFrameCounter = 0;
            }
        }

        function getCurrentSprite() {
            let config = ANIMATION_CONFIG[currentAnimation];
            if (!config) return null;
            let frameNumber = (currentFrameIndex % config.totalFrames) + 1;
            let img = new Image();
            img.src = `${ANIM_BASE_PATH}${currentAnimation}_${frameNumber}.png`;
            img.onerror = function() {
                this.src = "assets/images/characters/2.png";
            };
            return img;
        }

        function updateAnimation() {
            let config = ANIMATION_CONFIG[currentAnimation];
            if (!config) return;
            animationFrameCounter++;
            if (animationFrameCounter >= config.frameDelay) {
                animationFrameCounter = 0;
                currentFrameIndex++;
                if (currentFrameIndex >= config.totalFrames) {
                    if (currentAnimation === 'attack') {
                        setAnimation(config.nextState);
                    } else {
                        currentFrameIndex = 0;
                    }
                }
            }
        }

        let monsters = [];
        let playerBullets = [];
        let particleSystems = [];
        let floatingTexts = [];
        let monsterSpawnTimer = 0;

        function spawnExplosion(x, y, color = '#ff4400', count = 30) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 2 + Math.random() * 6;
                particleSystems.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1.5,
                    life: 30 + Math.random() * 30,
                    maxLife: 30 + Math.random() * 30,
                    size: 4 + Math.random() * 6,
                    color: color
                });
            }
        }

        function spawnFloatingText(x, y, text, color = '#ffcc00') {
            floatingTexts.push({
                x: x, y: y,
                text: text,
                color: color,
                life: 60,
                vy: -2.5
            });
        }

        function spawnMonster() {
            let maxMonsters = 4 + Math.floor(player.level / 3);
            if (monsters.length >= maxMonsters) return;
            let levelBonus = player.level * 10;
            monsters.push({
                x: Math.random() * WORLD_WIDTH,
                y: Math.random() * WORLD_HEIGHT,
                width: 30, height: 30,
                speed: 1.2 + (player.level / 6),
                hp: 60 + levelBonus, maxHp: 60 + levelBonus,
                damage: 8 + player.level,
                attackCooldown: 0, attackDelay: 40
            });
        }

        function firePlayerBullet() {
            if (player.kp < 15 || !isGameActive) return;
            player.kp -= 15;
            setAnimation('attack');

            let targetAngle = -Math.PI / 2;
            let nearestMonster = null;
            let minDistance = Infinity;

            for (let m of monsters) {
                let dx = m.x - player.x;
                let dy = m.y - player.y;
                let dist = Math.hypot(dx, dy);
                if (dist < minDistance) {
                    minDistance = dist;
                    nearestMonster = m;
                }
            }
            if (nearestMonster) {
                targetAngle = Math.atan2(nearestMonster.y - player.y, nearestMonster.x - player.x);
            }

            playerBullets.push({
                x: player.x, y: player.y,
                vx: Math.cos(targetAngle) * 10,
                vy: Math.sin(targetAngle) * 10,
                radius: 8, damage: 50
            });
            updateHUD();
        }

        let gameLoopInterval = null;
        let frameRate = 16;

        function updateGameLogic() {
            if (!isGameActive || !isCharacterSelected) return;

            let dx = 0, dy = 0;
            if (inputState.up) dy = -player.speed;
            if (inputState.down) dy = player.speed;
            if (inputState.left) { dx = -player.speed; player.facing = -1; }
            if (inputState.right) { dx = player.speed; player.facing = 1; }

            if (dx !== 0 || dy !== 0) {
                if (currentAnimation !== 'attack') setAnimation('run');
            } else {
                if (currentAnimation !== 'attack') setAnimation('idle');
            }

            let nextX = player.x + dx;
            if (!checkCollision(nextX, player.y, player.width, player.height)) {
                player.x = nextX;
            }
            let nextY = player.y + dy;
            if (!checkCollision(player.x, nextY, player.width, player.height)) {
                player.y = nextY;
            }

            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;

            updateAnimation();

            monsterSpawnTimer++;
            if (monsterSpawnTimer > 50) {
                monsterSpawnTimer = 0;
                spawnMonster();
            }

            for (let i = monsters.length - 1; i >= 0; i--) {
                let m = monsters[i];
                let angleToPlayer = Math.atan2(player.y - m.y, player.x - m.x);
                m.x += Math.cos(angleToPlayer) * m.speed;
                m.y += Math.sin(angleToPlayer) * m.speed;

                let distToPlayer = Math.hypot(player.x - m.x, player.y - m.y);
                if (distToPlayer < (player.width / 2 + m.width / 2) && m.attackCooldown <= 0) {
                    player.hp -= m.damage;
                    m.attackCooldown = m.attackDelay;
                    spawnExplosion(m.x, m.y, '#ff0000', 10);

                    if (player.hp <= 0) {
                        player.hp = 0;
                        isGameActive = false;
                        clearInterval(gameLoopInterval);
                        setAnimation('die');
                        setTimeout(() => {
                            alert("Bạn đã chết! Quay về trang chủ.");
                            window.location.href = "index.html";
                        }, 1500);
                    }
                }
                if (m.attackCooldown > 0) m.attackCooldown--;
            }

            for (let i = playerBullets.length - 1; i >= 0; i--) {
                let b = playerBullets[i];
                b.x += b.vx;
                b.y += b.vy;

                if (b.x < 0 || b.x > WORLD_WIDTH || b.y < 0 || b.y > WORLD_HEIGHT) {
                    playerBullets.splice(i, 1);
                    continue;
                }

                let bulletHit = false;
                for (let j = monsters.length - 1; j >= 0; j--) {
                    let m = monsters[j];
                    let distBulletMonster = Math.hypot(m.x - b.x, m.y - b.y);
                    if (distBulletMonster < (m.width / 2 + b.radius)) {
                        m.hp -= b.damage;
                        bulletHit = true;
                        if (m.hp <= 0) {
                            spawnExplosion(m.x, m.y, '#ff8800', 40);
                            spawnFloatingText(m.x, m.y - 20, '+ EXP', '#2ecc71');
                            player.exp += 100 + (player.level * 20);
                            player.kills++;
                            player.hp = Math.min(player.maxHp, player.hp + 30);
                            player.kp = Math.min(player.maxKp, player.kp + 30);
                            checkLevelUp();
                            savePlayerData();
                            updateHUD();
                            monsters.splice(j, 1);
                        }
                        break;
                    }
                }
                if (bulletHit) {
                    playerBullets.splice(i, 1);
                }
            }

            if (player.kp < player.maxKp) player.kp += 0.3;
            if (player.hp < player.maxHp && player.hp > 0) player.hp += 0.2;

            for (let i = particleSystems.length - 1; i >= 0; i--) {
                let p = particleSystems[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15;
                p.life--;
                if (p.life <= 0) { particleSystems.splice(i, 1); }
            }
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.life--;
                if (ft.life <= 0) { floatingTexts.splice(i, 1); }
            }

            updateHUD();
        }

        function renderGraphics() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            renderWorld();

            for (let m of monsters) {
                let sx = m.x - camera.x;
                let sy = m.y - camera.y;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(sx - m.width/2, sy - m.height/2 - 12, m.width, 6);
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(sx - m.width/2 + 1, sy - m.height/2 - 11, (m.width - 2) * (m.hp / m.maxHp), 4);
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(sx, sy, m.width / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('👹', sx, sy);
            }

            for (let b of playerBullets) {
                let sx = b.x - camera.x;
                let sy = b.y - camera.y;
                ctx.beginPath();
                ctx.arc(sx, sy, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00ffcc';
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            let px = player.x - camera.x;
            let py = player.y - camera.y;
            let currentSprite = getCurrentSprite();
            
            ctx.save();
            ctx.translate(px, py);
            if (player.facing === -1) ctx.scale(-1, 1);
            
            if (currentSprite && currentSprite.complete && currentSprite.naturalWidth > 0) {
                ctx.drawImage(currentSprite, -player.width/2, -player.height/2, player.width, player.height);
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-player.width/2, -player.height/2, player.width, player.height);
            }
            ctx.restore();

            for (let p of particleSystems) {
                let sx = p.x - camera.x;
                let sy = p.y - camera.y;
                let alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(sx, sy, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            for (let ft of floatingTexts) {
                let sx = ft.x - camera.x;
                let sy = ft.y - camera.y;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(ft.text, sx, sy);
            }
        }

        function startGameLoop() {
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(() => {
                updateGameLogic();
                renderGraphics();
            }, frameRate);
        }

        function checkLevelUp() {
            let expRequired = 100000 * player.level;
            while (player.exp >= expRequired) {
                player.exp -= expRequired;
                player.level++;
                player.maxHp += 100;
                player.maxKp += 100;
                player.hp = player.maxHp;
                player.kp = player.maxKp;
                expRequired = 100000 * player.level;
                spawnExplosion(player.x, player.y, '#f1c40f', 50);
                spawnFloatingText(player.x, player.y - 30, '🎊 LEVEL UP!', '#9b59b6');
            }
        }

        // ==========================================
        // LOGIC ANALOG STICK (Xử lý joystick vòng tròn)
        // ==========================================
        const inputState = { up: false, down: false, left: false, right: false };
        let joystickActive = false;
        let joystickTouchId = null;

        function getJoystickInput(clientX, clientY) {
            const zone = document.getElementById('joystickZone');
            const rect = zone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const radius = rect.width / 2;

            // Tính vector từ tâm ra điểm chạm
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            let distance = Math.hypot(dx, dy);

            // Giới hạn bên trong vòng tròn
            if (distance > radius) {
                dx = (dx / distance) * radius;
                dy = (dy / distance) * radius;
                distance = radius;
            }

            // Di chuyển nút gạt (Knob) theo vị trí ngón tay
            const knob = document.getElementById('stickKnob');
            knob.style.left = `calc(50% + ${dx}px)`;
            knob.style.top = `calc(50% + ${dy}px)`;

            // Tính toán hướng di chuyển và tốc độ (dựa trên phần trăm khoảng cách)
            let normalized = distance / radius; // 0 -> 1
            let speedMultiplier = Math.min(normalized, 1.0);

            // Ngưỡng kích hoạt (Deadzone) để tránh rung lắc
            if (normalized < 0.15) {
                inputState.up = false; inputState.down = false;
                inputState.left = false; inputState.right = false;
                player.speed = 4; // Reset về tốc độ mặc định khi thả
                return;
            }

            // Tính góc
            let angle = Math.atan2(dy, dx);
            
            // Cập nhật biến inputState (xử lý 8 hướng)
            let absX = Math.abs(Math.cos(angle));
            let absY = Math.abs(Math.sin(angle));

            inputState.up = (dy < 0 && absY > absX) || (dy < 0 && absY < 0.2);
            inputState.down = (dy > 0 && absY > absX) || (dy > 0 && absY < 0.2);
            inputState.left = (dx < 0 && absX > absY) || (dx < 0 && absX < 0.2);
            inputState.right = (dx > 0 && absX > absY) || (dx > 0 && absX < 0.2);
            
            // Thay đổi tốc độ dựa trên độ xa của ngón tay
            player.speed = 4 * speedMultiplier; // Tốc độ tối đa là 4
        }

        function startStick(e) {
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            joystickActive = true;
            document.getElementById('joystickZone').classList.add('active');
            getJoystickInput(touch.clientX, touch.clientY);
        }

        function moveStick(e) {
            e.preventDefault();
            if (!joystickActive) return;
            const touch = e.touches ? e.touches[0] : e;
            getJoystickInput(touch.clientX, touch.clientY);
        }

        function stopStick() {
            joystickActive = false;
            document.getElementById('joystickZone').classList.remove('active');
            // Reset nút gạt về giữa
            const knob = document.getElementById('stickKnob');
            knob.style.left = '50%';
            knob.style.top = '50%';
            
            // Reset trạng thái di chuyển
            inputState.up = false; inputState.down = false;
            inputState.left = false; inputState.right = false;
            player.speed = 4;
        }

        // ==========================================

        function playerAttack() { firePlayerBullet(); }

        // Hỗ trợ phím bàn phím PC (WASD vẫn hoạt động song song)
        document.addEventListener('keydown', function(e) {
            const key = e.key.toLowerCase();
            if (key === 'w') { inputState.up = true; e.preventDefault(); }
            else if (key === 's') { inputState.down = true; e.preventDefault(); }
            else if (key === 'a') { inputState.left = true; e.preventDefault(); }
            else if (key === 'd') { inputState.right = true; e.preventDefault(); }
            else if (key === ' ' || key === 'e') { e.preventDefault(); playerAttack(); }
        });
        document.addEventListener('keyup', function(e) {
            const key = e.key.toLowerCase();
            if (key === 'w') { inputState.up = false; e.preventDefault(); }
            else if (key === 's') { inputState.down = false; e.preventDefault(); }
            else if (key === 'a') { inputState.left = false; e.preventDefault(); }
            else if (key === 'd') { inputState.right = false; e.preventDefault(); }
        });

        function updateHUD() {
            let hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
            let kpPercent = Math.max(0, (player.kp / player.maxKp) * 100);
            document.getElementById('hpBar').style.width = hpPercent + '%';
            document.getElementById('kpBar').style.width = kpPercent + '%';
            document.getElementById('hpText').innerText = `${Math.max(0, Math.floor(player.hp))}/${player.maxHp}`;
            document.getElementById('kpText').innerText = `${Math.max(0, Math.floor(player.kp))}/${player.maxKp}`;
            document.getElementById('lvText').innerText = player.level;
            document.getElementById('expText').innerText = player.exp.toLocaleString('vi-VN');
        }

        function selectCharacter(path) {
            if (isCharacterSelected) return;
            document.getElementById('avatarImg').src = path;
            document.getElementById('charSelectOverlay').style.display = 'none';
            isCharacterSelected = true;
            isGameActive = true;
            monsterSpawnTimer = 0;
            startGameLoop();
            console.log("Game Engine started. Using Analog Stick.");
        }

        resizeCanvas();
        updateHUD();
        console.log("RPG Engine v2.0 Loaded. Analog Stick control enabled.");
    </script>
</body>
